<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>CoursePilot is offline</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f5f3ee;color:#162033}
    main{width:min(100%,420px);padding:32px;border:1px solid #e2e8f0;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.1);text-align:center}
    img{width:150px;max-height:46px;object-fit:contain}h1{margin:28px 0 8px;font-size:28px;letter-spacing:-.04em}p{margin:0;color:#64748b;line-height:1.6}
    button{margin-top:24px;border:0;border-radius:999px;background:#2563eb;color:#fff;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer}
    @media(prefers-color-scheme:dark){body{background:#07101f;color:#f8fafc}main{border-color:#24324a;background:#101a2c}p{color:#94a3b8}}
  </style>
</head>
<body>
  <main>
    <picture><source media="(prefers-color-scheme:dark)" srcset="/branding/dark_logo.svg" /><img src="/branding/light_logo.svg" alt="CoursePilot" /></picture>
    <h1>You’re offline</h1>
    <p>CoursePilot could not reach the network. Previously opened pages may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
